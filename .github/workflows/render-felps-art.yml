name: Render FELPS Instagram art
on:
  push:
    branches: [main, master]
    paths:
      - 'artes/2026-10-29-teste-felps.svg'
      - '.github/workflows/render-felps-art.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg
      - name: Render 1080x1350 PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='artes/2026-10-29-teste-felps.svg', write_to='artes/2026-10-29-teste-felps.png', output_width=1080, output_height=1350)
          PY
      - name: Commit rendered image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artes/2026-10-29-teste-felps.png
          git diff --cached --quiet || (git commit -m "Render FELPS Instagram artwork" && git push)
