<text x="72" y="340" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#176eb7">PRESENÇA DIGITAL / DESCOBERTA</text>
<text x="62" y="470" font-family="Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-3" fill="#102130">ENCONTRAR</text><text x="62" y="558" font-family="Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-3" fill="#102130">VOCÊ NÃO PODE</text><text x="62" y="646" font-family="Arial,sans-serif" font-size="80" font-weight="800" letter-spacing="-3" fill="#1676cf">SER DIFÍCIL.</text>
<text x="70" y="706" font-family="Arial,sans-serif" font-size="20" fill="#405565">Se horários, serviços e contato estão espalhados,</text><text x="70" y="736" font-family="Arial,sans-serif" font-size="20" fill="#405565">o cliente precisa fazer esforço antes de falar com você.</text>
