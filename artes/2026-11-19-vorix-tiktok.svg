<path d="M72 1580H1008" stroke="#fff" stroke-width="2" opacity=".8"/><text x="72" y="1620" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2.5" fill="#176eb7">UM SITE BEM ESTRUTURADO REÚNE</text><text x="72" y="1655" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#102334">serviços, horários e contato em um só lugar.</text><text x="72" y="1685" font-family="Arial,sans-serif" font-size="17" fill="#405565">Menos procura. Um caminho mais claro até sua empresa.</text>
