<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<linearGradient id="sky" x2="1" y2="1"><stop stop-color="#f8f4eb"/><stop offset=".55" stop-color="#d8e1e4"/><stop offset="1" stop-color="#96aab6"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#b7d1df" stop-opacity=".65"/><stop offset="1" stop-color="#527e9c" stop-opacity=".45"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#78e2ff"/><stop offset=".48" stop-color="#248ff3"/><stop offset="1" stop-color="#1249ac"/></linearGradient>
<linearGradient id="sign" x2="0" y2="1"><stop stop-color="#263d4e"/><stop offset="1" stop-color="#0b1a29"/></linearGradient>
<linearGradient id="footer" x2="0" y2="1"><stop stop-color="#0c1a28"/><stop offset="1" stop-color="#050b12"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="15"/><feOffset dy="13"/><feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grain" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r=".7" fill="#263b4c" opacity=".14"/><circle cx="23" cy="22" r=".7" fill="#fff" opacity=".35"/></pattern>
</defs>
<rect width="1080" height="1920" fill="url(#sky)"/><rect width="1080" height="1920" fill="url(#grain)"/><circle cx="850" cy="560" r="440" fill="url(#sun)"/>
