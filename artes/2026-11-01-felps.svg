<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/><stop offset=".55" stop-color="#171512"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/><stop offset=".22" stop-color="#d7a844"/><stop offset=".52" stop-color="#f7d879"/><stop offset=".78" stop-color="#9d6b20"/><stop offset="1" stop-color="#f1c75d"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#c08a2e" stop-opacity=".24"/><stop offset="1" stop-color="#c08a2e" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".45" stop-color="#b7812c"/><stop offset=".72" stop-color="#f6d77a"/><stop offset="1" stop-color="#6f4a17"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#d7a844" stroke-opacity=".07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
