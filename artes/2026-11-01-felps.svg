  <text x="78" y="222" fill="#d9d3c7" font-family="Montserrat, Arial, sans-serif" font-size="17" letter-spacing="4">PRESENÇA DIGITAL INTELIGENTE</text>
  <text x="76" y="316" fill="#f8f5ed" font-family="Montserrat, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">TRANSFORME</text>
  <text x="76" y="390" fill="#f8f5ed" font-family="Montserrat, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">CLIQUES EM</text>
  <text x="76" y="464" fill="url(#gold)" font-family="Montserrat, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">OPORTUNIDADES.</text>
  <rect x="78" y="500" width="265" height="5" rx="2.5" fill="url(#gold)"/>
  <text x="78" y="558" fill="#dedbd4" font-family="Montserrat, Arial, sans-serif" font-size="25">Um site profissional apresenta</text>
  <text x="78" y="594" fill="#dedbd4" font-family="Montserrat, Arial, sans-serif" font-size="25">sua empresa com clareza, fortalece</text>
  <text x="78" y="630" fill="#dedbd4" font-family="Montserrat, Arial, sans-serif" font-size="25">a confiança e facilita o contato.</text>
