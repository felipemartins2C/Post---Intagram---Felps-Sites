  <text x="78" y="1262" fill="#f8f5ed" font-family="Montserrat, Arial, sans-serif" font-size="19" letter-spacing="2">SITES QUE CONECTAM</text>
  <text x="1000" y="1262" text-anchor="end" fill="#b9a67e" font-family="Montserrat, Arial, sans-serif" font-size="15" letter-spacing="3">FELPS SITES</text>
  <path d="M78 1287H1002" stroke="url(#gold)" stroke-width="1" opacity=".55"/>
